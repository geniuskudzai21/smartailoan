<section id="authPage" class="auth-container hidden">

<div class="auth-card" id="userAuthForms">

<h2>Welcome</h2>
<p class="subtitle">Sign in or create your account</p>

<div id="authMessage"></div>

<div id="loginForm">
<label><i data-lucide="mail" style="width:14px;height:14px;"></i> Email or Phone</label>
<input id="contact" placeholder="Enter your email or phone">

<label><i data-lucide="lock" style="width:14px;height:14px;"></i> Password</label>
<input id="password" type="password" placeholder="Enter your password">

<button class="btn-primary" onclick="loginUser()"><i data-lucide="log-in"></i> Sign In</button>

<div class="toggle-link">
No account? <a onclick="showRegister()">Create one</a>
</div>
<div class="toggle-link">
<a onclick="goHome()" style="color:#94a3b8;">&larr; Back</a>
</div>
</div>

<div id="registerForm" class="hidden">
<label><i data-lucide="user" style="width:14px;height:14px;"></i> Full Name</label>
<input id="fullname" placeholder="Enter your full name">

<label><i data-lucide="mail" style="width:14px;height:14px;"></i> Email or Phone</label>
<input id="regContact" placeholder="Enter your email or phone">

<label><i data-lucide="lock" style="width:14px;height:14px;"></i> Password</label>
<input id="regPassword" type="password" placeholder="Create a password">

<button class="btn-primary" onclick="registerUser()"><i data-lucide="user-plus"></i> Create Account</button>

<div class="toggle-link">
Already have an account? <a onclick="showLogin()">Sign In</a>
</div>
<div class="toggle-link">
<a onclick="goHome()" style="color:#94a3b8;">&larr; Back</a>
</div>
</div>

</div>

</section>
